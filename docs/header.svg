<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="900" height="346"
     role="img" aria-label="Vision: network VAPT orchestration. 55 tools across six phases — discovery, enumeration, vulnerability scanning, exploitation, credentials, pivoting and traffic analysis — driven by 30 pure-Python modules with no runtime dependencies, covered by 1782 tests.">
<title>Vision — the stack it drives</title>
<style>
  text{font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
  .accent{fill:#22d3ee} .green{fill:#87d787} .mag{fill:#d787d7}
  .yellow{fill:#ffb642} .red{fill:#ff4444} .cyan{fill:#5fd7d7}
  .white{fill:#eeeeee} .grey{fill:#8a8a8a} .dim{fill:#5b6472}

  .wordmark{font-size:52px;font-weight:700;letter-spacing:-.02em;fill:#ffb642}
  .tagline{font-size:13px;fill:#8a8a8a;letter-spacing:.04em}
  .grouplabel{font-size:9.5px;fill:#5b6472;letter-spacing:.16em}
  .tool{font-size:11px;fill:#c8cdd4}
  .statnum{font-size:21px;font-weight:700}
  .statlabel{font-size:9px;fill:#5b6472;letter-spacing:.13em}

  /* Everything rests visible; animation only reveals into the finished frame.
     A renderer that ignores CSS animation shows the complete header rather
     than a blank panel. */
  .r{opacity:1;animation:fade .5s ease-out backwards}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}}

  .pip{animation:pulse 3.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* The rule under the wordmark draws itself once, left to right. */
  .rule{stroke:#22d3ee;stroke-width:1.5;animation:draw 1.6s ease-out backwards}
  @keyframes draw{from{stroke-dasharray:0 820}to{stroke-dasharray:820 0}}

  @media (prefers-reduced-motion:reduce){
    .r{opacity:1;animation:none}
    .pip{opacity:.8;animation:none}
    .rule{animation:none}
  }
</style>

<rect width="900" height="346" rx="12" fill="#12161c"/>

<!-- wordmark -->
<g transform="translate(40,74)">
  <text class="wordmark r" style="animation-delay:.1s">VISION</text>
  <text x="4" y="26" class="tagline r" style="animation-delay:.35s">network vapt orchestration · verify before you fire</text>
  <line x1="0" y1="44" x2="820" y2="44" class="rule" style="animation-delay:.5s"/>
</g>

<!-- the stack it drives, grouped by engagement phase -->
<g transform="translate(40,148)">
  <text class="grouplabel r" style="animation-delay:.7s">DISCOVERY</text>
  <text y="17" class="tool r" style="animation-delay:.75s">nmap · masscan · rustscan · naabu · fping · arp-scan · amass</text>

  <text y="42" class="grouplabel r" style="animation-delay:.85s">ENUMERATION</text>
  <text y="59" class="tool r" style="animation-delay:.9s">netexec · smbmap · rpcclient · snmpwalk · ldapsearch · showmount · ike-scan</text>

  <text y="84" class="grouplabel r" style="animation-delay:1.0s">VULNERABILITY</text>
  <text y="101" class="tool r" style="animation-delay:1.05s">nuclei · testssl.sh · sslscan · sslyze · searchsploit · nmap NSE</text>

  <text y="126" class="grouplabel r" style="animation-delay:1.15s">EXPLOITATION &#183; GATED</text>
  <text y="143" class="tool r" style="animation-delay:1.2s">
    <tspan x="0">metasploit · impacket · evil-winrm · responder</tspan>
    <tspan x="272" class="dim">— never fired unattended</tspan></text>
</g>

<!-- counts, right-aligned so they read as a spec sheet rather than badges -->
<g transform="translate(646,150)">
  <rect x="-16" y="-18" width="230" height="130" rx="6" fill="#171c24"/>

  <circle cx="0" cy="4" r="3" class="green pip" style="animation-delay:0s"/>
  <text x="14" y="9" class="statnum green r" style="animation-delay:.8s">55</text>
  <text x="50" y="8" class="statlabel r" style="animation-delay:.8s">TOOLS DRIVEN</text>

  <circle cx="0" cy="36" r="3" class="accent pip" style="animation-delay:.9s"/>
  <text x="14" y="41" class="statnum accent r" style="animation-delay:.95s">32</text>
  <text x="50" y="40" class="statlabel r" style="animation-delay:.95s">STAGES · 6 PHASES</text>

  <circle cx="0" cy="68" r="3" class="mag pip" style="animation-delay:1.8s"/>
  <text x="14" y="73" class="statnum mag r" style="animation-delay:1.1s">1782</text>
  <text x="82" y="72" class="statlabel r" style="animation-delay:1.1s">TESTS · 27 SUITES</text>

  <circle cx="0" cy="100" r="3" class="yellow pip" style="animation-delay:2.4s"/>
  <text x="14" y="105" class="statnum yellow r" style="animation-delay:1.25s">0</text>
  <text x="34" y="104" class="statlabel r" style="animation-delay:1.25s">DEPENDENCIES</text>
</g>

<!-- build surface -->
<g transform="translate(40,326)">
  <text class="r" style="animation-delay:1.4s;font-size:10.5px">
    <tspan x="0" class="dim">built on</tspan>
    <tspan x="58" class="grey">python 3.10+</tspan>
    <tspan x="150" class="dim">·</tspan>
    <tspan x="162" class="grey">stdlib only</tspan>
    <tspan x="240" class="dim">·</tspan>
    <tspan x="252" class="grey">kali · debian · ubuntu · parrot · macos</tspan>
    <tspan x="530" class="dim">·</tspan>
    <tspan x="542" class="grey">MITRE ATT&amp;CK · CIS · PCI DSS · OWASP</tspan>
  </text>
</g>
</svg>
